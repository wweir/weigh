# Cut a release: build `weighd` for every supported platform, assemble the archives with a
# checksum file, and -- when this is a release run -- attach them to a GitHub Release.
#
# Two ways in:
#
#   * push a version tag (`v0.1.0`): the release path. The tag must agree with both manifests
#     and sit on main, and the assembled assets are published.
#   * `workflow_dispatch` (which defaults to `rehearse: true`): the *same* matrix and the *same*
#     packaging from the dispatched commit, with no tag and nothing published. The assembled
#     bundle is uploaded as a workflow artifact, so a rehearsal is inspectable and the macOS
#     cross-builds and pinned runner labels are exercised here rather than on the tag that
#     matters. `rehearse: false` plus `tag` is the path for re-publishing an existing tag.
#
# What is deliberately NOT built here, and why:
#   * Windows -- `weighd` registers SIGTERM/SIGINT through `signal-hook`, and while that crate
#     does expose SIGTERM on Windows, the drain path has never been executed there. Adding an
#     untested target to a release matrix means finding out on the tag that matters.
#   * static musl -- a glibc build runs on the distributions this is deployed on; a musl build
#     needs a cross toolchain for `tokenizers`' C dependencies (`onig`, `esaxx`) and is a
#     separate piece of work, not a matrix line.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rehearse:
        description: Build and assemble from this ref, publishing nothing (no tag needed)
        type: boolean
        default: true
      tag:
        description: Existing tag to publish; only read when rehearse is false
        required: false

# Read-only at the workflow level; the one job that may publish asks for more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # What to build, and which release identity it has. A rehearsal has no identity: the
  # dispatched commit is the subject, and the artifacts are labelled after it so they cannot be
  # mistaken for a release. A release refuses to start when the tag and the manifests disagree,
  # because that would label a release with a version it does not contain -- which no later
  # download could detect.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      rehearsal: ${{ steps.resolve.outputs.rehearsal }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TAG_INPUT: ${{ inputs.tag }}
          REHEARSE_INPUT: ${{ inputs.rehearse }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            requested="$REF_NAME"; ref="$REF_NAME"; rehearsal=false
          elif [ "${REHEARSE_INPUT:-false}" = "true" ]; then
            requested=""; ref="$SHA"; rehearsal=true
          else
            requested="${TAG_INPUT:-}"; ref="$requested"; rehearsal=false
            if [ -z "$requested" ]; then
              echo "::error::dispatch without a tag needs rehearse: true (nothing to publish)"
              exit 1
            fi
          fi
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "rehearsal=$rehearsal" >> "$GITHUB_OUTPUT"

      # Full history: the ancestry check below is meaningless against a shallow checkout.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          fetch-depth: 0

      - id: identity
        env:
          REQUESTED: ${{ steps.resolve.outputs.requested }}
          REHEARSAL: ${{ steps.resolve.outputs.rehearsal }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Both crates carry the released version, and they have to agree with each other
          # whether or not this is a rehearsal.
          weigh_version="$(grep -m1 '^version' weigh/Cargo.toml | cut -d'"' -f2)"
          weighd_version="$(grep -m1 '^version' weighd/Cargo.toml | cut -d'"' -f2)"
          if [ "$weigh_version" != "$weighd_version" ]; then
            echo "::error::weigh/Cargo.toml is $weigh_version but weighd/Cargo.toml is $weighd_version"
            exit 1
          fi
          version="$weigh_version"
          if [ "$REHEARSAL" = "true" ]; then
            tag="v${version}-rehearsal-$(echo "$SHA" | cut -c1-7)"
            echo "rehearsing $version as $tag (nothing will be published)"
          else
            tag="$REQUESTED"
            case "$tag" in
              v[0-9]*) ;;
              *) echo "::error::tag '$tag' must look like vX.Y.Z"; exit 1 ;;
            esac
            if [ "${tag#v}" != "$version" ]; then
              echo "::error::tag says ${tag#v} but both manifests say $version"
              exit 1
            fi
            echo "$tag agrees with the manifests"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: the tag is on main
        if: steps.resolve.outputs.rehearsal != 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$(git rev-parse --short HEAD) is not on main; releases are cut from main"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: the commit is green
        run: cargo test --workspace --locked

  build:
    needs: verify
    strategy:
      # One target failing must not hide the state of the others: a partially built release is
      # easier to reason about than a cancelled matrix.
      fail-fast: false
      matrix:
        include:
          # Linux images are pinned, not `-latest`: what a build links against becomes a floor
          # every consumer has to meet, and that floor must not move as a side effect of a
          # runner-image rollout. Measured today, the x86_64 archive requires GLIBC_2.34
          # (`readelf --version-info weighd | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1`),
          # which is what makes "not newer than that without meaning to" a check rather than a
          # hope -- note that is well below the image's own glibc, so the pin buys headroom
          # rather than following it. `ubuntu-latest` is Ubuntu 24.04 today and migrates to
          # Ubuntu 26 on 2026-10-19 (actions/runner-images#14748), i.e. the name would have
          # changed under us. ci.yml stays on `-latest` on purpose, as the canary for when this
          # pin has fallen behind.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            expect: 'ELF 64-bit.*x86-64'
            run: 'true'
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            expect: 'ELF 64-bit.*aarch64'
            run: 'true'
          - target: aarch64-apple-darwin
            # Pinned for the same reason as the Linux images: the SDK on the build image sets
            # the minimum macOS the binary will run on. `macos-latest` is macOS 26 (arm64)
            # today, so this is that same image by name.
            os: macos-26
            expect: 'Mach-O 64-bit.*arm64'
            run: 'true'
          - target: x86_64-apple-darwin
            # Cross-built on the arm64 macOS runner: Apple's clang targets both architectures
            # from one SDK. Not executed here (that would need Rosetta, and the x64 images are
            # larger-runner labels), so its architecture is asserted from the artifact itself.
            os: macos-26
            expect: 'Mach-O 64-bit.*x86_64'
            run: 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      # The resolved commit, not the ref this workflow happens to run on.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} -p weighd

      # The archive is the thing users download, so it is what gets checked: named after the
      # release identity, carrying the binary plus the licence and the crate's README.
      - name: package
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="weighd-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/weighd" "dist/$name/weighd"
          cp weighd/LICENSE weighd/README.md "dist/$name/"
          tar -czf "dist/${name}.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: artifact is the right architecture and not a stub
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          set -euo pipefail
          tar -xzf "dist/${NAME}.tar.gz" -C dist
          file -b "dist/${NAME}/weighd" > detected.txt
          cat detected.txt
          grep -Eq "$EXPECT" detected.txt || {
            echo "::error::expected /$EXPECT/ in the binary, got: $(cat detected.txt)"
            exit 1
          }
          size=$(wc -c < "dist/${NAME}/weighd")
          if [ "$size" -lt 1000000 ]; then
            echo "::error::weighd is only $size bytes -- a release binary is megabytes"
            exit 1
          fi

      - name: the release binary runs
        if: matrix.run == 'true'
        run: ./dist/${NAME}/weighd --help

      - uses: actions/upload-artifact@v7
        with:
          name: weighd-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Assembles the published set. It runs for a rehearsal too, because this is the half that a
  # rehearsal has to exercise: the merge, the checksum file, and the four archives side by side.
  # Only the last step -- the one that needs a release to exist -- is skipped there.
  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The only job that may write: it creates the Release and uploads the assets.
      contents: write
    steps:
      # Kept at v8 deliberately, one major ahead of the upload above: `upload-artifact@v7`
      # records a SHA-256 digest per artifact (its `artifact-digest` output) and this download
      # verifies the bytes it received against that digest, failing by default on a mismatch
      # (`digest-mismatch: error`). That is the only integrity check between Actions storage
      # and the assets this workflow publishes -- SHA256SUMS below is computed *after* it, so it
      # would faithfully checksum a corrupted download.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Computed once, on the one platform whose `sha256sum` is guaranteed: macOS ships
      # `shasum` instead, which is why the matrix jobs publish no checksums of their own.
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # Always uploaded, so a rehearsal leaves something verifiable behind: without this the
      # assembled set would exist only on a runner that is about to be destroyed.
      - uses: actions/upload-artifact@v7
        with:
          name: weighd-${{ needs.verify.outputs.tag }}-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # A re-run of the same tag (a flaky matrix leg, say) replaces the assets instead of
      # failing on the ones that already exist.
      - name: publish
        if: needs.verify.outputs.rehearsal != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          weighd ${VERSION} -- SemIf's decision readout as an OpenAI-shaped HTTP service.

          Assets are \`weighd-v${VERSION}-<target>.tar.gz\`, each containing the binary, \`LICENSE\`
          and \`README.md\` for that target. Targets: x86_64/aarch64 Linux (glibc) and
          arm64/x86_64 macOS. No Windows and no static musl build -- see the workflow comments.

          Verify before running:

          \`\`\`bash
          sha256sum --check SHA256SUMS        # macOS: shasum -a 256 --check SHA256SUMS
          tar -xzf weighd-v${VERSION}-<target>.tar.gz
          ./weighd-v${VERSION}-<target>/weighd --help
          \`\`\`

          \`weighd\` needs a checkpoint directory (with \`tokenizer.json\`) and a vLLM >= 0.26.0 or
          SGLang endpoint; both are refused at startup rather than guessed at. See the crate
          README for the flags and the HTTP surface.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/*.tar.gz dist/SHA256SUMS
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "weighd ${VERSION}" \
              --notes-file notes.md \
              dist/*.tar.gz dist/SHA256SUMS
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "\(.name)  \(.size) bytes")'

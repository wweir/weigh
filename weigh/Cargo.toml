[package]
name = "weigh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Exact per-slot logprobs from an OpenAI-compatible inference server, with the provenance to attribute them"
readme = "README.md"
keywords = ["llm", "logprobs", "vllm", "sglang", "structured-output"]
categories = ["api-bindings", "science"]

[dependencies]
# The SAME crate the Python `tokenizers` package wraps (0.23.2 == 0.23.2), so
# token-id parity is constructive rather than something to be aligned by hand.
# Verified: 64/64 rows byte-identical ids against transformers.
tokenizers = "0.23.2"
# `float_roundtrip` is REQUIRED for correctness, not an optimization. Without it
# serde_json's fast float parser is not correctly rounded: it read a server's
# `-14.312512397766113` as a double whose shortest repr is `-14.312512397766112`,
# off by 1 ULP, on 157/777 rows. The raw response text was identical to Python's, so
# this silently corrupted values the server returned exactly.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# No TLS feature: this crate talks plain HTTP to a local inference server, and dropping
# rustls keeps the dependency tree (and the audit surface) small.
ureq = { version = "2", default-features = false }
sha2 = "0.10"
# Base64 for `data:` image URIs. Already in the tree via `tokenizers`, so this adds no new
# code to audit -- only the direct edge.
base64 = "0.22"
# Shortest-round-trip float digits. Needed because Rust's own `{:e}` (Grisu) breaks an
# exact tie differently from CPython's `dtoa`: measured 5 of 20,000 random bit patterns
# disagreed on the LAST digit.
ryu = "1"

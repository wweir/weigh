# Two crates on purpose:
#
#   weigh          the library: ask an OpenAI-compatible server for the exact logprobs of
#                  caller-named answer slots, and get a subset softmax plus provenance
#   weighd         one consumer: SemIf's `direct-options-v1` decision API, served over HTTP
#
# The split is a real API boundary, not a rename: the library never sees a "criterion",
# an "evidence" string, or a `direct-options-v1` prompt, and it does not depend on the HTTP
# service layer. SemIf's contract lives entirely in the binary.
[workspace]
resolver = "2"
members = ["weigh", "weighd"]

[workspace.package]
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/wweir/weigh"
rust-version = "1.82"

# Profiles are honoured only at the workspace root. `panic = "abort"` is a binary concern
# (a library that is depended on ignores it), which is why it is here and not in the
# library's own manifest.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
